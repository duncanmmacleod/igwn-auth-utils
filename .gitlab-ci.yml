workflow:
  rules:
    # run for merge requests
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # don't run on branches if there's an open merge request
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    # run on branches and tags
    - if: $CI_COMMIT_BRANCH || $CI_COMMIT_TAG

include:
  # -- Python ------------------------

  - component: $CI_SERVER_FQDN/computing/gitlab/components/python/all@4
    inputs:
      merge_request_pipelines: true
      uv: true
      code_quality_analyzer: "ruff"
      python_versions:
        - "3.11"
        - "3.12"
        - "3.13"
        - "3.14"
      pip_install_options: &uv_options >-
        -r pyproject.toml
        --all-extras
        --group dev
  - component: $CI_SERVER_FQDN/computing/gitlab/components/python/ty@4
    inputs:
      uv_options: *uv_options

  # -- Debian packaging --------------

  - component: $CI_SERVER_FQDN/computing/gitlab/components/debian/all@2
    inputs:
      merge_request_pipelines: true
      needs: [sdist]
      debian_versions:
        - bookworm
      test_install: &system_test_install >-
        python3-igwn-auth-utils
        python3-pytest
        python3-pytest-cov
        python3-requests-mock
      test_script: &system_test_script
        - /usr/bin/python3 -m pytest
            -ra
            --cov igwn_auth_utils
            --durations 0
            --junit-xml junit.xml
            --pyargs igwn_auth_utils.tests
            --verbose
        # report coverage
        - python3 -m coverage xml

  # -- Red Hat packaging -------------

  - component: $CI_SERVER_FQDN/computing/gitlab/components/redhat/all@2
    inputs:
      merge_request_pipelines: true
      needs: [sdist]
      redhat_versions:
        - 8
        - 9
      test_install: *system_test_install
      test_script: *system_test_script

  # -- Documentation -----------------

  - component: $CI_SERVER_FQDN/computing/gitlab/components/sphinx/build@1
    inputs:
      requirements: ". --group docs"
      apt_packages: >-
        graphviz

# -- customisations ------------------

redhat_test_el8:
  before_script:
    - !reference [redhat_test, before_script]
    # install a newer version of pytest and friends on EL8
    - dnf install -y -q python3-pip &&
      python3 -m pip install
        --upgrade-strategy=only-if-needed
        "coverage[toml]==5.3"
        "pytest==6.0.0"
        "pytest-cov==2.10.1"
